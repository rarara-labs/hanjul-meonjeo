<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한줄먼저</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --accent: #b4f03c;
    --accent2: #7c6ef0;
    --text: #f0f0f0;
    --muted: #888;
    --border: #2e2e3e;
    --cat-일상: #b4f03c;
    --cat-돈: #f0b43c;
    --cat-몸: #f04c7c;
    --cat-배움: #7c6ef0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard', -apple-system, sans-serif;
    min-height: 100vh;
  }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .tab { flex: 1; padding: 14px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all .2s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* PAGES */
  .page { display: none; padding: 20px; max-width: 480px; margin: 0 auto; }
  .page.active { display: block; }

  /* STREAK */
  .streak-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; background: var(--surface); border-radius: 14px; padding: 14px 18px; border: 1px solid var(--border); }
  .streak-num { font-size: 28px; font-weight: 800; color: var(--accent); }
  .streak-label { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .streak-emoji { font-size: 24px; }

  /* WRITE */
  .write-box { background: var(--surface); border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
  .write-box textarea { width: 100%; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; font-family: 'Pretendard', -apple-system, sans-serif; resize: none; min-height: 80px; line-height: 1.6; }
  .write-box textarea::placeholder { color: var(--muted); }
  .cats { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .cat { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 2px solid transparent; opacity: .45; transition: all .2s; font-family: 'Pretendard', sans-serif; }
  .cat.active { opacity: 1; }
  .cat[data-cat="일상"] { color: var(--cat-일상); border-color: var(--cat-일상); }
  .cat[data-cat="돈"] { color: var(--cat-돈); border-color: var(--cat-돈); }
  .cat[data-cat="몸"] { color: var(--cat-몸); border-color: var(--cat-몸); }
  .cat[data-cat="배움"] { color: var(--cat-배움); border-color: var(--cat-배움); }
  .amount-row { display: none; align-items: center; gap: 8px; margin-bottom: 12px; }
  .amount-row.show { display: flex; }
  .amount-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 14px; font-family: 'Pretendard', sans-serif; outline: none; }
  .amount-row select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 14px; font-family: 'Pretendard', sans-serif; outline: none; cursor: pointer; }
  .write-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .char-count { font-size: 12px; color: var(--muted); }
  .btn-save { background: var(--accent); color: #0f0f13; border: none; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 700; font-family: 'Pretendard', sans-serif; cursor: pointer; transition: opacity .2s; }
  .btn-save:hover { opacity: .85; }

  /* FEED */
  .feed-item { background: var(--surface); border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border); }
  .feed-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .feed-cat { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 10px; }
  .feed-date { font-size: 11px; color: var(--muted); }
  .feed-text { font-size: 15px; line-height: 1.6; }
  .feed-amount { font-size: 13px; margin-top: 6px; font-weight: 600; }
  .feed-delete { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; opacity: .4; transition: opacity .2s; }
  .feed-delete:hover { opacity: 1; color: #f04c7c; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 12px; }

  /* CALENDAR */
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .cal-nav { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; color: var(--text); cursor: pointer; font-size: 18px; }
  .cal-title { font-size: 16px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day-name { text-align: center; font-size: 11px; color: var(--muted); padding: 6px 4px; font-weight: 600; }
  .cal-cell { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 13px; font-weight: 500; transition: background .15s; }
  .cal-cell:hover { background: var(--surface2); }
  .cal-cell.today { font-weight: 800; color: var(--accent); }
  .cal-cell.has-record::after { content: ''; position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .cal-cell.empty { opacity: 0; pointer-events: none; }
  .cal-cell.selected { background: var(--accent) !important; color: #0f0f13; font-weight: 800; }
  .cal-cell.selected::after { background: #0f0f13; }
  .cal-detail { margin-top: 20px; }
  .cal-detail-title { font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .monthly-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .summary-card { background: var(--surface); border-radius: 12px; padding: 14px; border: 1px solid var(--border); }
  .summary-card .num { font-size: 22px; font-weight: 800; }
  .summary-card .label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* BACKUP */
  .backup-btn { display: block; width: 100%; margin-top: 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: var(--muted); font-size: 13px; font-family: 'Pretendard', sans-serif; cursor: pointer; text-align: center; }
  .backup-btn:hover { color: var(--text); }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0f0f13; padding: 10px 24px; border-radius: 20px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" onclick="showPage('write', this)">✏️ 기록</div>
  <div class="tab" onclick="showPage('feed', this)">📋 피드</div>
  <div class="tab" onclick="showPage('calendar', this)">📅 달력</div>
</div>

<!-- 기록 탭 -->
<div id="page-write" class="page active">
  <div class="streak-bar">
    <div class="streak-emoji">🔥</div>
    <div>
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label">일 연속 기록 중</div>
    </div>
    <div style="flex:1"></div>
    <div style="text-align:right">
      <div style="font-size:20px;font-weight:800" id="total-num">0</div>
      <div style="font-size:11px;color:var(--muted)">총 기록</div>
    </div>
  </div>

  <div class="write-box">
    <textarea id="write-text" maxlength="100" placeholder="오늘 한 줄만 남겨요. 뭐든 괜찮아요 😊"></textarea>
    <div class="cats">
      <div class="cat active" data-cat="일상" onclick="selectCat(this)">☀️ 일상</div>
      <div class="cat" data-cat="돈" onclick="selectCat(this)">💰 돈</div>
      <div class="cat" data-cat="몸" onclick="selectCat(this)">🏃 몸</div>
      <div class="cat" data-cat="배움" onclick="selectCat(this)">📚 배움</div>
    </div>
    <div class="amount-row" id="amount-row">
      <select id="amount-type">
        <option value="지출">지출</option>
        <option value="수입">수입</option>
      </select>
      <input id="amount-val" type="number" placeholder="금액 (원)" />
    </div>
    <div class="write-actions">
      <span class="char-count"><span id="char-count">0</span>/100</span>
      <button class="btn-save" onclick="saveRecord()">남기기 →</button>
    </div>
  </div>
  <button class="backup-btn" onclick="backup()">💾 내 기록 백업하기</button>
</div>

<!-- 피드 탭 -->
<div id="page-feed" class="page">
  <div id="feed-list"></div>
</div>

<!-- 달력 탭 -->
<div id="page-calendar" class="page">
  <div class="monthly-summary">
    <div class="summary-card">
      <div class="num" id="month-count">0</div>
      <div class="label">이번 달 기록</div>
    </div>
    <div class="summary-card">
      <div class="num" id="month-expense" style="color:var(--cat-돈)">0원</div>
      <div class="label">이번 달 지출</div>
    </div>
  </div>
  <div class="cal-header">
    <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
    <div class="cal-title" id="cal-title"></div>
    <button class="cal-nav" onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="cal-detail" id="cal-detail"></div>
</div>

<div class="toast" id="toast"></div>

<script>
let records = [];
let selectedCat = '일상';
let calYear, calMonth;
let selectedDate = null;

const now = new Date();
calYear = now.getFullYear();
calMonth = now.getMonth();

// 로컬스토리지 로드
function loadRecords() {
  try { records = JSON.parse(localStorage.getItem('hanjul_records') || '[]'); } 
  catch(e) { records = []; }
}

function saveRecords() {
  try { localStorage.setItem('hanjul_records', JSON.stringify(records)); } 
  catch(e) {}
}

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 카테고리 선택
function selectCat(el) {
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedCat = el.dataset.cat;
  document.getElementById('amount-row').classList.toggle('show', selectedCat === '돈');
}

// 글자수
document.getElementById('write-text').addEventListener('input', function() {
  document.getElementById('char-count').textContent = this.value.length;
});

// 저장
function saveRecord() {
  const text = document.getElementById('write-text').value.trim();
  if (!text) { showToast('한 줄이라도 남겨봐요 😊'); return; }
  const rec = {
    id: Date.now(),
    text,
    cat: selectedCat,
    date: new Date().toISOString(),
    dateStr: toDateStr(new Date())
  };
  if (selectedCat === '돈') {
    const amt = parseInt(document.getElementById('amount-val').value);
    const type = document.getElementById('amount-type').value;
    if (amt) rec.amount = { value: amt, type };
  }
  records.unshift(rec);
  saveRecords();
  document.getElementById('write-text').value = '';
  document.getElementById('char-count').textContent = '0';
  document.getElementById('amount-val').value = '';
  render();
  showToast(getReaction());
}

function getReaction() {
  const msgs = ['오늘도 기록했어요 🌱','한 줄이 쌓여요 ✨','잘했어요! 💪','기록하는 사람이 됐어요 🔥','오늘 하루 남겼어요 👏','브이로그 안 해도 괜찮아요 😄'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

// 삭제
function deleteRecord(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  records = records.filter(r => r.id !== id);
  saveRecords();
  render();
}

// 백업
function backup() {
  const data = JSON.stringify(records, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hanjul_backup_${toDateStr(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('백업 완료! 💾');
}

// 탭
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
}

// 토스트
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 렌더
function render() {
  renderStats();
  renderFeed();
  renderCalendar();
}

function renderStats() {
  const today = toDateStr(new Date());
  document.getElementById('total-num').textContent = records.length;
  let streak = 0;
  const dates = [...new Set(records.map(r => r.dateStr))].sort().reverse();
  let check = today;
  for (let d of dates) {
    if (d === check) {
      streak++;
      const dt = new Date(check);
      dt.setDate(dt.getDate() - 1);
      check = toDateStr(dt);
    } else break;
  }
  document.getElementById('streak-num').textContent = streak;
}

function renderFeed() {
  const list = document.getElementById('feed-list');
  if (!records.length) {
    list.innerHTML = `<div class="empty-state"><div class="big">📝</div><div>아직 기록이 없어요<br>첫 한 줄을 남겨봐요!</div></div>`;
    return;
  }
  const catColors = { 일상: 'var(--cat-일상)', 돈: 'var(--cat-돈)', 몸: 'var(--cat-몸)', 배움: 'var(--cat-배움)' };
  list.innerHTML = records.map(r => {
    const d = new Date(r.date);
    const ds = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const amtHtml = r.amount ? `<div class="feed-amount" style="color:${r.amount.type==='수입'?'var(--cat-몸)':'var(--cat-돈)'}">
      ${r.amount.type==='수입'?'+':'-'}${r.amount.value.toLocaleString()}원 ${r.amount.type}</div>` : '';
    return `<div class="feed-item">
      <div class="feed-meta">
        <span class="feed-cat" style="color:${catColors[r.cat]||'var(--accent)'};background:${catColors[r.cat]||'var(--accent)'}22">${r.cat}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="feed-date">${ds}</span>
          <button class="feed-delete" onclick="deleteRecord(${r.id})">×</button>
        </div>
      </div>
      <div class="feed-text">${r.text}</div>
      ${amtHtml}
    </div>`;
  }).join('');
}

function renderCalendar() {
  const y = calYear, m = calMonth;
  document.getElementById('cal-title').textContent = `${y}년 ${m+1}월`;
  const monthStr = `${y}-${String(m+1).padStart(2,'0')}`;
  const monthRecs = records.filter(r => r.dateStr && r.dateStr.startsWith(monthStr));
  document.getElementById('month-count').textContent = monthRecs.length;
  const expense = monthRecs.filter(r => r.amount && r.amount.type==='지출').reduce((s,r)=>s+r.amount.value,0);
  document.getElementById('month-expense').textContent = expense.toLocaleString() + '원';

  const days = ['일','월','화','수','목','금','토'];
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m+1, 0).getDate();
  const today = toDateStr(new Date());
  const hasRecord = new Set(monthRecs.map(r => r.dateStr));

  let html = days.map(d => `<div class="cal-day-name">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= last; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-cell', ds===today?'today':'', hasRecord.has(ds)?'has-record':'', ds===selectedDate?'selected':''].filter(Boolean).join(' ');
    html += `<div class="${cls}" onclick="selectCalDate('${ds}')">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML = html;

  if (selectedDate) {
    const dayRecs = records.filter(r => r.dateStr === selectedDate);
    const catColors = { 일상: 'var(--cat-일상)', 돈: 'var(--cat-돈)', 몸: 'var(--cat-몸)', 배움: 'var(--cat-배움)' };
    const [sy, sm, sd] = selectedDate.split('-');
    document.getElementById('cal-detail').innerHTML = `
      <div class="cal-detail-title">${parseInt(sm)}월 ${parseInt(sd)}일 기록 (${dayRecs.length}개)</div>
      ${dayRecs.length ? dayRecs.map(r => `
        <div class="feed-item">
          <div class="feed-meta">
            <span class="feed-cat" style="color:${catColors[r.cat]||'var(--accent)'};background:${catColors[r.cat]||'var(--accent)'}22">${r.cat}</span>
          </div>
          <div class="feed-text">${r.text}</div>
          ${r.amount?`<div class="feed-amount" style="color:${r.amount.type==='수입'?'var(--cat-몸)':'var(--cat-돈)'}">${r.amount.type==='수입'?'+':'-'}${r.amount.value.toLocaleString()}원</div>`:''}
        </div>`).join('') : '<div style="color:var(--muted);font-size:14px;padding:12px 0">이 날은 기록이 없어요</div>'}
    `;
  } else {
    document.getElementById('cal-detail').innerHTML = '';
  }
}

function selectCalDate(ds) {
  selectedDate = selectedDate === ds ? null : ds;
  renderCalendar();
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  selectedDate = null;
  renderCalendar();
}

// 시작
loadRecords();
render();
</script>
</body>
</html>
